services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    container_name: frontend
    restart: unless-stopped

  db_aforo:
    image: postgres:16-alpine
    container_name: db_aforo
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db_aforo
      POSTGRES_USER: aforo
      POSTGRES_PASSWORD: aforo_dev
    volumes:
      - aforo_data:/var/lib/postgresql/data
      - ./backend/aforo/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aforo -d db_aforo"]
      interval: 5s
      retries: 10

  db_ventas:
    image: postgres:16-alpine
    container_name: db_ventas
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: db_ventas
      POSTGRES_USER: ventas
      POSTGRES_PASSWORD: ventas_dev
    volumes:
      - ventas_data:/var/lib/postgresql/data
      - ./backend/venta-entradas/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas -d db_ventas"]
      interval: 5s
      retries: 10

  aforo:
    build: ./backend/aforo
    container_name: aforo
    ports:
      - "50051:50051"
    depends_on:
      db_aforo:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache: sin persistencia
    ports:
      - "6379:6379"  # expuesto solo para inspeccionar en dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  venta-entradas:
    build: ./backend/venta-entradas
    container_name: venta-entradas
    ports:
      - "8002:8002"
    # Ejecuta Uvicorn en el puerto 8002
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    volumes:
      - ./backend/venta-entradas:/app  # Opcional: Para Hot-Reload
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db_ventas:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  aforo_data:
  ventas_data:
