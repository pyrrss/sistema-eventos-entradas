openapi: 3.0.3
info:
  title: Microservicio Venta Entradas
  version: 1.0.0
  description: API REST pública para gestión de asistentes y ventas de entradas. Comunica internamente con servicio gRPC de Aforo.
servers:
  - url: http://localhost:8002/api/v1
    description: Servidor de desarrollo
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key para autenticación. Ejemplo: dev-key-123
  schemas:
    AsistenteCreate:
      type: object
      required:
        - rut
        - nombre_completo
        - email
      properties:
        rut:
          type: string
          maxLength: 20
          description: RUT chileno con guion (ej. 12.345.678-9)
        nombre_completo:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
    AsistenteUpdate:
      type: object
      required:
        - nombre_completo
        - email
      properties:
        nombre_completo:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
    AsistenteResponse:
      type: object
      properties:
        asistente_id:
          type: string
          format: uuid
        rut:
          type: string
        nombre_completo:
          type: string
        email:
          type: string
          format: email
        fecha_registro:
          type: string
          format: date-time
    VentaCreate:
      type: object
      required:
        - asistente_id
        - id_seccion_aforo
        - nombre_evento
        - nombre_seccion
        - cantidad
      properties:
        asistente_id:
          type: string
          format: uuid
        id_seccion_aforo:
          type: string
          format: uuid
        nombre_evento:
          type: string
          maxLength: 200
        nombre_seccion:
          type: string
          maxLength: 200
        cantidad:
          type: integer
          minimum: 1
        estado:
          type: string
          enum:
            - VENDIDA
            - ANULADA
          default: VENDIDA
    VentaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        venta_id:
          type: string
          format: uuid
        asistente_id:
          type: string
          format: uuid
        asistente_nombre:
          type: string
          nullable: true
        id_seccion_aforo:
          type: string
          format: uuid
        nombre_evento:
          type: string
        evento_nombre:
          type: string
          nullable: true
        nombre_seccion:
          type: string
        seccion_nombre:
          type: string
          nullable: true
        cantidad:
          type: integer
        estado:
          type: string
        fecha_venta:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    EventoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        nombre_lugar:
          type: string
        fecha_evento:
          type: string
    SeccionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        disponibles:
          type: integer
        total:
          type: integer
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            type: string
        msg:
          type: string
        type:
          type: string
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  version:
                    type: string
  /asistentes:
    post:
      summary: Crear asistente
      operationId: crear_asistente_asistentes_post
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsistenteCreate'
      responses:
        '201':
          description: Asistente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenteResponse'
        '400':
          description: RUT ya registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        '401':
          description: API Key inválida o faltante
    get:
      summary: Listar asistentes
      operationId: obtener_asistentes_asistentes_get
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de asistentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsistenteResponse'
        '401':
          description: API Key inválida o faltante
  /asistentes/{asistente_id}:
    get:
      summary: Obtener asistente por ID
      operationId: obtener_asistente_uuid_asistentes__asistente_id__get
      security:
        - ApiKeyAuth: []
      parameters:
        - name: asistente_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asistente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenteResponse'
        '404':
          description: Asistente no encontrado
        '401':
          description: API Key inválida o faltante
    delete:
      summary: Eliminar asistente
      operationId: eliminar_asistente_asistentes__asistente_id__delete
      security:
        - ApiKeyAuth: []
      parameters:
        - name: asistente_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asistente eliminado
        '404':
          description: Asistente no encontrado
        '401':
          description: API Key inválida o faltante
    put:
      summary: Actualizar asistente
      operationId: actualizar_asistente_asistentes__asistente_id__put
      security:
        - ApiKeyAuth: []
      parameters:
        - name: asistente_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsistenteUpdate'
      responses:
        '200':
          description: Asistente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenteResponse'
        '404':
          description: Asistente no encontrado
        '401':
          description: API Key inválida o faltante
  /asistentes/rut/{rut}:
    get:
      summary: Obtener asistente por RUT
      operationId: obtener_asistente_por_rut_asistentes_rut__rut__get
      security:
        - ApiKeyAuth: []
      parameters:
        - name: rut
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asistente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenteResponse'
        '404':
          description: Asistente no encontrado
        '401':
          description: API Key inválida o faltante
  /eventos:
    get:
      summary: Listar eventos (proxy a Aforo)
      operationId: listar_eventos_eventos_get
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResponse'
        '401':
          description: API Key inválida o faltante
        '500':
          description: Error consultando eventos
  /eventos/{evento_id}/secciones:
    get:
      summary: Listar secciones de un evento (proxy a Aforo gRPC)
      operationId: listar_secciones_evento_eventos__evento_id__secciones_get
      security:
        - ApiKeyAuth: []
      parameters:
        - name: evento_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de secciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeccionResponse'
        '401':
          description: API Key inválida o faltante
        '404':
          description: Evento no encontrado en Aforo
        '503':
          description: Servicio de Aforo no disponible
  /ventas:
    post:
      summary: Vender entrada (valida disponibilidad en Aforo vía gRPC)
      operationId: crear_venta_ventas_post
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VentaCreate'
      responses:
        '201':
          description: Venta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaResponse'
        '400':
          description: Error en datos o servicio Aforo
        '401':
          description: API Key inválida o faltante
        '404':
          description: Asistente no encontrado
        '409':
          description: No hay entradas disponibles (stock insuficiente)
        '503':
          description: Servicio de Aforo no disponible
        '504':
          description: Timeout consultando servicio de Aforo
    get:
      summary: Listar ventas
      operationId: listar_ventas_ventas_get
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de ventas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VentaResponse'
        '401':
          description: API Key inválida o faltante
  /ventas/{venta_id}:
    get:
      summary: Obtener venta por ID
      operationId: obtener_venta_ventas__venta_id__get
      security:
        - ApiKeyAuth: []
      parameters:
        - name: venta_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaResponse'
        '404':
          description: Venta no encontrada
        '401':
          description: API Key inválida o faltante
    delete:
      summary: Anular venta (libera aforo vía gRPC)
      operationId: anular_venta_ventas__venta_id__delete
      security:
        - ApiKeyAuth: []
      parameters:
        - name: venta_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Venta anulada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaResponse'
        '400':
          description: Venta ya anulada o error en Aforo
        '401':
          description: API Key inválida o faltante
        '404':
          description: Venta no encontrada
        '503':
          description: Servicio de Aforo no disponible
        '504':
          description: Timeout consultando servicio de Aforo