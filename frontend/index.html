<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión de Eventos y Entradas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">Sistema de Gestión de Eventos y Entradas</h1>
    <nav class="tabs" aria-label="Secciones">
      <button class="tab" data-tab="ventas" type="button">Ventas</button>
      <button class="tab" data-tab="asistentes" type="button">Asistentes</button>
    </nav>
  </header>

  <main class="app-main">
    <section id="view-ventas" class="view"></section>
    <section id="view-asistentes" class="view is-hidden"></section>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <div id="modal-root" class="modal-root is-hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal__header">
        <h2 id="modal-title" class="modal__title"></h2>
        <button id="modal-close" class="modal__close" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
